<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Räddel – Rätsel-Editor</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      main {
        max-width: 820px;
      }
      textarea {
        width: 100%;
        min-height: 85px;
      }
      input,
      select,
      textarea {
        padding: 10px;
        border: 1px solid #bdb4a4;
        border-radius: 6px;
        font: inherit;
      }
      label {
        display: block;
        margin: 10px 0 5px;
      }
      .editstep {
        padding: 15px;
        margin: 12px 0;
        border: 1px solid #d5cbb9;
        border-radius: 8px;
      }
      .editstep input {
        width: 100%;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .report {
        white-space: pre-wrap;
        padding: 12px;
        background: #f4ede0;
        border-radius: 8px;
      }
      .good {
        color: #176a36;
      }
      .bad {
        color: #a12b24;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Räddel<span class="dot">.</span> Editor</h1>
      <p class="tagline">Rätsel offline erstellen, prüfen und exportieren.</p>
    </header>
    <main>
      <p>
        Dieser Editor arbeitet vollständig lokal. Ein Export enthält alle
        vorhandenen Rätsel und das neue Rätsel. Lade die erzeugte Datei als
        <code>puzzles.js</code> zusammen mit der Website hoch.
      </p>
      <div class="row2">
        <div>
          <label for="date">Veröffentlichungstag</label
          ><input type="date" id="date" />
        </div>
        <div>
          <label for="theme">Thema</label
          ><input id="theme" value="Wortverbindungen" />
        </div>
      </div>
      <label for="start">Startwort</label
      ><input id="start" placeholder="z. B. HAUS" />
      <div id="steps"></div>
      <button class="outline" id="add" type="button">
        + Schritt hinzufügen
      </button>
      <p>
        <button class="primary" id="validate" type="button">
          Rätsel prüfen
        </button>
        <button class="outline" id="export" type="button">
          Rätselpaket exportieren
        </button>
      </p>
      <div id="report" class="report" role="status"></div>
      <p><a href="index.html">← Zurück zum Spiel</a></p>
    </main>
    <script src="puzzles.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
